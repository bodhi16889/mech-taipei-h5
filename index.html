<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080d" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<title>台北機甲拆除模擬器 · 工程拆除切片</title>
<style>
  :root {
    --ink: #e8f1ff;
    --panel: rgba(7, 12, 20, .78);
    --line: rgba(120, 190, 255, .26);
    --accent: #6fd0ff;
    --warn: #ff9e6d;
    --bad: #ff5f6d;
    --good: #8ef0b2;
    --red: #ff5a4d;
    --blue: #63c7ff;
    --yellow: #ffd35a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04070c; }
  body {
    color: var(--ink);
    font: 13px/1.6 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- 共通 ---------- */
  .screen { position: fixed; inset: 0; display: none; place-items: center; z-index: 6; padding: 20px; overflow-y: auto; }
  .screen.on { display: grid; }
  .card { width: min(1080px, 100%); }
  .eyebrow { color: var(--accent); letter-spacing: .3em; font-size: 10.5px; }
  .screen h1 { margin: 8px 0 6px; font-size: clamp(20px, 3.4vw, 34px); letter-spacing: .06em; }
  .screen h2 { margin: 0 0 8px; font-size: clamp(17px, 2.4vw, 24px); letter-spacing: .05em; }
  .screen p { color: #9fb6d4; }
  .btn {
    cursor: pointer; padding: 10px 22px; border-radius: 999px; font: inherit;
    border: 1px solid rgba(111, 208, 255, .6); background: rgba(111, 208, 255, .12);
    color: #e2f4ff; letter-spacing: .16em; font-size: 13px;
  }
  .btn:hover { background: rgba(111, 208, 255, .24); }
  .btn[disabled] { opacity: .35; cursor: not-allowed; }
  .btn.ghost { border-color: var(--line); background: transparent; color: #b9cfe8; }

  /* ---------- 合約板 ---------- */
  #menu { background: radial-gradient(circle at 50% 20%, rgba(16, 34, 54, .9), rgba(3, 6, 11, .98)); }
  .contracts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 18px; }
  .contract {
    text-align: left; cursor: pointer; padding: 14px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(9, 15, 26, .78); color: inherit;
    font: inherit; transition: border-color .15s, transform .15s;
  }
  .contract:hover { border-color: rgba(111, 208, 255, .7); transform: translateY(-2px); }
  .contract .tagline { font-size: 10.5px; letter-spacing: .22em; color: var(--accent); }
  .contract .tagline.black { color: var(--warn); }
  .contract strong { display: block; margin: 6px 0 4px; font-size: 14.5px; }
  .contract small { color: #8fa7c4; font-size: 11.5px; display: block; line-height: 1.5; }
  .contract .pay { margin-top: 8px; color: var(--good); font-variant-numeric: tabular-nums; font-size: 13px; }
  .wallet { margin-top: 14px; color: #9fb6d4; font-size: 12px; }
  .wallet b { color: var(--warn); font-size: 16px; font-variant-numeric: tabular-nums; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; display: none; }
  #hud.on { display: block; }
  .panel {
    position: fixed; padding: 10px 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px);
  }
  #obj { top: 14px; left: 14px; width: 268px; }
  #obj .t { color: var(--accent); font-size: 10.5px; letter-spacing: .2em; }
  #obj .name { font-weight: 700; margin: 2px 0 8px; }
  #obj ul { margin: 0; padding: 0; list-style: none; }
  #obj li { font-size: 12px; color: #c9dcef; display: flex; gap: 6px; align-items: baseline; }
  #obj li::before { content: "○"; color: #6b8199; font-size: 10px; }
  #obj li.done { color: #7f9ab8; text-decoration: line-through; }
  #obj li.done::before { content: "●"; color: var(--good); }
  #obj li.hot { color: var(--warn); }
  #obj li.hot::before { content: "▲"; color: var(--warn); }

  #stats { top: 14px; right: 14px; width: 246px; }
  #stats .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #stats .label { color: #9fb6d4; font-size: 11px; }
  #credits { font-size: 20px; font-weight: 700; color: var(--warn); font-variant-numeric: tabular-nums; }
  #quota { font-variant-numeric: tabular-nums; color: #cfe0f5; font-size: 12px; }
  #bar { height: 4px; margin-top: 6px; border-radius: 2px; background: rgba(120,190,255,.16); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--good)); transition: width .25s ease; }
  #alerts { margin-top: 8px; font-size: 11.5px; }
  #alerts .a { color: var(--bad); }
  #alerts .b { color: var(--warn); }
  #alerts .c { color: var(--good); }

  #tools { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
  .tool {
    pointer-events: auto; cursor: pointer; min-width: 78px; padding: 7px 10px; border-radius: 9px;
    border: 1px solid var(--line); background: rgba(9, 15, 26, .8); color: #b9cfe8;
    font: inherit; font-size: 11.5px; text-align: center; letter-spacing: .06em;
  }
  .tool.on { border-color: var(--accent); color: #e6f6ff; box-shadow: 0 0 0 1px rgba(111,208,255,.35) inset; }
  .tool small { display: block; font-size: 9.5px; color: #7f9ab8; letter-spacing: .1em; }

  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    pointer-events: none; opacity: .85;
  }
  #crosshair i, #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: var(--accent);
  }
  #crosshair::before { left: 12px; top: 0; width: 2px; height: 8px; }
  #crosshair::after { left: 12px; bottom: 0; width: 2px; height: 8px; }
  #crosshair i:nth-child(1) { top: 12px; left: 0; width: 8px; height: 2px; }
  #crosshair i:nth-child(2) { top: 12px; right: 0; width: 8px; height: 2px; }
  #crosshair.hit::before, #crosshair.hit::after, #crosshair.hit i { background: var(--warn); }

  #prompt {
    position: fixed; left: 50%; top: calc(50% + 30px); transform: translateX(-50%);
    font-size: 12.5px; color: #dff0ff; text-shadow: 0 2px 10px #000; pointer-events: none;
    text-align: center; opacity: 0; transition: opacity .12s; white-space: nowrap;
  }
  #prompt.on { opacity: 1; }
  #prompt b { color: var(--accent); }

  #cutbar {
    position: fixed; left: 50%; top: calc(50% + 48px); transform: translateX(-50%);
    width: 160px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.14);
    opacity: 0; transition: opacity .12s; overflow: hidden; pointer-events: none;
  }
  #cutbar.on { opacity: 1; }
  #cutbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--warn), var(--bad)); }

  #coretimer {
    position: fixed; left: 50%; top: 16%; transform: translateX(-50%);
    font-size: 26px; font-weight: 800; color: var(--bad); letter-spacing: .1em;
    text-shadow: 0 0 24px rgba(255, 60, 70, .6); opacity: 0; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #coretimer.on { opacity: 1; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }

  #log {
    position: fixed; left: 14px; bottom: 14px; width: 320px; pointer-events: none;
  }
  #log .l {
    font-size: 11.5px; color: #cfe0f5; margin-top: 4px; opacity: 0;
    animation: fadeUp 3.4s ease-out both; text-shadow: 0 1px 6px #000;
  }
  #log .l.warn { color: var(--warn); }
  #log .l.bad { color: var(--bad); }
  #log .l.good { color: var(--good); }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(6px); }
    12% { opacity: 1; transform: none; }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }

  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5;
  }
  #flash.on { animation: boom .5s ease-out both; }
  @keyframes boom { 0% { opacity: .85; } 100% { opacity: 0; } }

  /* ---------- 結算 ---------- */
  #debrief { background: radial-gradient(circle at 50% 30%, rgba(12, 26, 42, .94), rgba(2, 4, 8, .99)); }
  .ledger { margin-top: 16px; border-top: 1px solid var(--line); }
  .ledger .r { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed rgba(120,190,255,.14); font-size: 13px; }
  .ledger .r b { font-variant-numeric: tabular-nums; }
  .ledger .r.minus b { color: var(--bad); }
  .ledger .r.total { font-size: 16px; padding-top: 12px; }
  .ledger .r.total b { color: var(--warn); font-size: 22px; }
  .upgrades { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 18px; }
  .up {
    text-align: left; cursor: pointer; padding: 12px; border-radius: 10px; font: inherit; color: inherit;
    border: 1px solid var(--line); background: rgba(9,15,26,.8);
  }
  .up:hover { border-color: rgba(111,208,255,.6); }
  .up b { display: block; font-size: 13px; }
  .up small { color: #8fa7c4; font-size: 11px; }
  .up .cost { color: var(--good); font-size: 12px; margin-top: 6px; display: block; }

  /* ---------- 手機 ---------- */
  #stick {
    position: fixed; z-index: 4; display: none;
    left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 124px; height: 124px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(10,18,30,.42); touch-action: none; pointer-events: auto;
  }
  #stick .knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; border: 1px solid rgba(160,225,255,.75);
    background: radial-gradient(circle, rgba(111,208,255,.9), rgba(111,208,255,.2));
  }
  #useBtn {
    position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: 96px; z-index: 4; display: none; pointer-events: auto;
    width: 92px; height: 92px; border-radius: 50%; touch-action: none;
    border: 1px solid rgba(255,158,109,.7); background: rgba(255,158,109,.14);
    color: #ffd2b0; font: inherit; font-size: 13px; letter-spacing: .16em;
  }
  #actBtn {
    position: fixed; right: max(24px, env(safe-area-inset-right)); bottom: 198px; z-index: 4; display: none; pointer-events: auto;
    width: 64px; height: 64px; border-radius: 50%; touch-action: none;
    border: 1px solid rgba(111,208,255,.7); background: rgba(111,208,255,.14);
    color: #dff2ff; font: inherit; font-size: 12px;
  }
  #look { position: fixed; inset: 0; z-index: 1; pointer-events: auto; }
  html.touch #stick, html.touch #useBtn, html.touch #actBtn { display: block; }
  html.touch #tools { bottom: 176px; }

  @media (max-width: 640px) {
    #obj { width: 46vw; padding: 8px 10px; }
    #obj .name { font-size: 12px; }
    #obj li { font-size: 10.5px; }
    #stats { width: 42vw; padding: 8px 10px; }
    #credits { font-size: 16px; }
    .tool { min-width: 58px; font-size: 10px; padding: 6px 7px; }
    .tool small { display: none; }
    #log { width: 58vw; bottom: 80px; }
    #log .l { font-size: 10.5px; }
    #coretimer { font-size: 20px; top: 22%; }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <!-- ================= 合約板 ================= -->
  <div id="menu" class="screen on">
    <div class="card">
      <div class="eyebrow">TAIPEI DEMOLITION BUREAU / CONTRACT BOARD</div>
      <h1>台北機甲拆除模擬器</h1>
      <p>2087 年，退役機甲散落在台北街廓。你是外包拆除工：切開裝甲、洩掉液壓、繫留承重、在反應爐熔毀前取出核心。</p>
      <div class="contracts" id="contracts"></div>
      <div class="wallet">目前資金 <b id="wallet">0</b> 元 · 工具升級在每次結算後開放</div>
    </div>
  </div>

  <!-- ================= HUD ================= -->
  <div id="hud">
    <div id="obj" class="panel">
      <div class="t">CONTRACT</div>
      <div class="name" id="objName">—</div>
      <ul id="objList"></ul>
    </div>

    <div id="stats" class="panel">
      <div class="row"><span class="label">本次回收</span><span id="credits">0</span></div>
      <div class="row"><span class="label">配額</span><span id="quota">0 / 0</span></div>
      <div id="bar"><i></i></div>
      <div id="alerts"></div>
    </div>

    <div id="tools">
      <button class="tool on" data-tool="cutter">電漿切割<small>1 · 按住左鍵</small></button>
      <button class="tool" data-tool="tether">重力繫留<small>2 · 點擊部件</small></button>
      <button class="tool" data-tool="gel">冷凍凝膠<small>3 · 點擊火源</small></button>
      <button class="tool" data-tool="scan">聲納掃描<small>4 · 按住</small></button>
    </div>

    <div id="crosshair"><i></i><i></i></div>
    <div id="prompt"></div>
    <div id="cutbar"><i></i></div>
    <div id="coretimer">CORE MELTDOWN 60</div>
    <div id="log"></div>
    <div id="flash"></div>

    <div id="look"></div>
    <div id="stick"><div class="knob"></div></div>
    <button id="useBtn">切割</button>
    <button id="actBtn">E</button>
  </div>

  <!-- ================= 結算 ================= -->
  <div id="debrief" class="screen">
    <div class="card">
      <div class="eyebrow" id="dbEyebrow">SETTLEMENT</div>
      <h2 id="dbTitle">拆除結算</h2>
      <p id="dbSub"></p>
      <div class="ledger" id="ledger"></div>
      <div class="upgrades" id="upgrades"></div>
      <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="nextBtn">接下一個合約</button>
        <button class="btn ghost" id="againBtn">重做這一單</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';

  /* ================================================================== *
   * 1. 設定 / 資料
   * ================================================================== */
  const IS_COARSE = window.matchMedia('(pointer: coarse)').matches;
  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.documentElement.classList.toggle('touch', IS_COARSE);

  const CONFIG = {
    eye: 1.7,
    walk: 5.4,
    run: 8.2,
    jetFuel: 3.2,
    jetPush: 8.5,
    interactRange: 13,
    cutterRate: 1.0,          // 每秒切割進度（1.0 = 1 秒切完 1 單位）
    tetherTime: 1.15,
    coreTimer: 60,
  };

  const CONTRACTS = [
    {
      id: 's1', kind: '市政', title: '忠孝東路突圍戰殘局',
      site: '忠孝東路高架橋斷裂處', mech: 'quad', landmark: '捷運軌道',
      quota: 3, pay: 120000, hazard: '液壓管道老舊失修',
      brief: '四足重型突擊機甲卡在斷橋邊，下方是無人捷運軌道。切斷承重柱前先繫留，否則整台會砸下去。',
    },
    {
      id: 's2', kind: '市政', title: '西門町十字路口封鎖線',
      site: '西門町霓虹招牌群', mech: 'humanoid', landmark: '行人天橋',
      quota: 4, pay: 180000, hazard: '機身卡在冷氣機群中',
      brief: '輕量人形機卡在建築外牆，操作空間狹小。任何傾倒都會波及行人天橋。',
    },
    {
      id: 's3', kind: '市政', title: '台北 101 基座墜落事件',
      site: '信義區金融廢墟', mech: 'fortress', landmark: '101 基座',
      quota: 5, pay: 360000, hazard: '反應爐受損 · 輻射外洩',
      brief: '超重型要塞機甲陷在地基坑洞，核心計時器只有 60 秒。先把裝甲拆開，才有機會。',
    },
    {
      id: 's4', kind: '黑市', title: '社子島地下違章改裝廠',
      site: '社子島鐵皮廠房', mech: 'scrap', landmark: '鐵皮廠房',
      quota: 4, pay: 520000, hazard: '反拆解自爆裝置',
      brief: '非標準規格拼裝機。黑市要的是完整的神經控制晶片——切錯管線，整間廠房跟你一起走。',
    },
  ];

  const UPGRADES = [
    { id: 'cutter', name: '電漿切割器', desc: '切割速度 +30%', base: 60000 },
    { id: 'tether', name: '重力絞盤', desc: '繫留更快、承重 +1', base: 50000 },
    { id: 'suit', name: '外骨骼防護', desc: '爆炸傷害 -40%、噴射燃料 +1s', base: 45000 },
  ];

  /* ================================================================== *
   * 2. 狀態
   * ================================================================== */
  const state = {
    screen: 'menu',
    credits: 45000,
    upgrades: { cutter: 0, tether: 0, suit: 0 },
    contract: null,
    parts: [],
    salvaged: 0,
    earned: 0,
    penalties: [],
    quotaMet: false,
    depressurized: false,
    coreExposed: false,
    coreTaken: false,
    coreLeft: CONFIG.coreTimer,
    meltdown: false,
    toppled: false,
    jettedFuel: CONFIG.jetFuel,
    fires: [],
    startedAt: 0,
    elapsed: 0,
    finished: false,
  };

  const dom = {
    app: document.getElementById('app'),
    menu: document.getElementById('menu'),
    hud: document.getElementById('hud'),
    debrief: document.getElementById('debrief'),
    contracts: document.getElementById('contracts'),
    wallet: document.getElementById('wallet'),
    objName: document.getElementById('objName'),
    objList: document.getElementById('objList'),
    credits: document.getElementById('credits'),
    quota: document.getElementById('quota'),
    bar: document.querySelector('#bar i'),
    alerts: document.getElementById('alerts'),
    crosshair: document.getElementById('crosshair'),
    prompt: document.getElementById('prompt'),
    cutbar: document.getElementById('cutbar'),
    cutbarFill: document.querySelector('#cutbar i'),
    coretimer: document.getElementById('coretimer'),
    log: document.getElementById('log'),
    flash: document.getElementById('flash'),
    look: document.getElementById('look'),
    stick: document.getElementById('stick'),
    knob: document.querySelector('#stick .knob'),
    useBtn: document.getElementById('useBtn'),
    actBtn: document.getElementById('actBtn'),
    ledger: document.getElementById('ledger'),
    upgrades: document.getElementById('upgrades'),
    dbTitle: document.getElementById('dbTitle'),
    dbSub: document.getElementById('dbSub'),
    nextBtn: document.getElementById('nextBtn'),
    againBtn: document.getElementById('againBtn'),
  };

  /* ================================================================== *
   * 3. 音效（WebAudio，零檔案）
   * ================================================================== */
  const sfx = (() => {
    let ctx = null, master = null, muted = false;
    function ensure() {
      if (ctx) return ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.45; master.connect(ctx.destination);
      return ctx;
    }
    function tone({ freq = 180, dur = 0.15, type = 'square', gain = 0.15, to = 60 } = {}) {
      const c = ensure(); if (!c || muted) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, c.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(28, to), c.currentTime + dur);
      g.gain.setValueAtTime(gain, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(master); o.start(); o.stop(c.currentTime + dur + 0.02);
    }
    function noise({ dur = 0.5, gain = 0.3, freq = 500 } = {}) {
      const c = ensure(); if (!c || muted) return;
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
      const g = c.createGain(); g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(master); src.start();
    }
    return {
      resume() { const c = ensure(); if (c && c.state === 'suspended') c.resume(); },
      cut() { noise({ dur: 0.09, gain: 0.05, freq: 2400 }); },
      done() { tone({ freq: 320, dur: 0.14, type: 'triangle', gain: 0.14, to: 520 }); },
      boom() { noise({ dur: 1.1, gain: 0.5, freq: 220 }); tone({ freq: 70, dur: 0.8, type: 'sine', gain: 0.35, to: 40 }); },
      alarm() { tone({ freq: 880, dur: 0.12, type: 'square', gain: 0.1, to: 660 }); },
      win() { [523, 659, 784].forEach((f, i) => setTimeout(() => tone({ freq: f, dur: 0.3, type: 'triangle', gain: 0.14, to: f + 40 }), i * 120)); },
      bad() { tone({ freq: 180, dur: 0.4, type: 'sawtooth', gain: 0.18, to: 70 }); },
    };
  })();

  /* ================================================================== *
   * 4. Renderer / 場景
   * ================================================================== */
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_COARSE ? 1.5 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = !REDUCE;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  dom.app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0f17);
  scene.fog = new THREE.Fog(0x0a0f17, 26, 130);

  const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 400);

  scene.add(new THREE.HemisphereLight(0x8fb6ff, 0x1a2230, 0.85));
  scene.add(new THREE.AmbientLight(0x5f7fa8, 0.7));

  const key = new THREE.DirectionalLight(0xcfe4ff, 1.5);
  key.position.set(12, 22, 10);

  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1; key.shadow.camera.far = 80;
  key.shadow.camera.left = -24; key.shadow.camera.right = 24;
  key.shadow.camera.top = 24; key.shadow.camera.bottom = -24;
  scene.add(key);

  // 城市底光：兩側霓虹
  const neonA = new THREE.PointLight(0x39c6ff, 40, 60, 2); neonA.position.set(-14, 6, -10); scene.add(neonA);
  const neonB = new THREE.PointLight(0xff4f8b, 30, 55, 2); neonB.position.set(15, 5, 8); scene.add(neonB);
  const baseLights = [neonA, neonB].map((l) => { l.base = l.intensity; return l; });

  const ground = new THREE.Mesh(

  /* ---- 遠景：台北街廓剪影（在地感，不可互動） ---- */
  function buildSkyline() {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x111a26, roughness: 0.9, emissive: 0x0a1420 });
    const winMat = new THREE.MeshBasicMaterial({ color: 0x9fd4ff, transparent: true, opacity: 0.35 });
    for (let i = 0; i < 34; i++) {
      const w = 6 + Math.random() * 10, d = 6 + Math.random() * 10, h = 10 + Math.random() * 34;
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      const ang = (i / 34) * Math.PI * 2;
      const r = 52 + Math.random() * 30;
      b.position.set(Math.cos(ang) * r, h / 2, Math.sin(ang) * r);
      g.add(b);
      const strip = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.7, h * 0.6), winMat);
      strip.position.set(b.position.x, h * 0.55, b.position.z + d / 2 + 0.05);
      strip.rotation.y = Math.atan2(b.position.x, b.position.z);
      g.add(strip);
    }
    // 台北 101 剪影
    const tower = new THREE.Group();
    const tmat = new THREE.MeshStandardMaterial({ color: 0x2a4459, emissive: 0x123047, emissiveIntensity: 0.8, roughness: 0.5 });
    let y = 0, s = 9;
    for (let i = 0; i < 8; i++) {
      const seg = new THREE.Mesh(new THREE.BoxGeometry(s, 5.6, s), tmat);
      seg.position.y = y + 2.8; tower.add(seg);
      y += 5.6; s = Math.max(4, s * 0.92);
    }
    tower.position.set(-46, 0, -58);
    g.add(tower);
    scene.add(g);
  }
  buildSkyline();

   * 5. 機甲藍圖

  const MAT = {
    armor: new THREE.MeshStandardMaterial({ color: 0x5a6a7c, roughness: 0.45, metalness: 0.75 }),
    armorHot: new THREE.MeshStandardMaterial({ color: 0xc85a3c, emissive: 0x421208, emissiveIntensity: 0.6, roughness: 0.5, metalness: 0.6 }),
    frame: new THREE.MeshStandardMaterial({ color: 0x2f3a46, roughness: 0.65, metalness: 0.55 }),
    strut: new THREE.MeshStandardMaterial({ color: 0x3b4854, roughness: 0.55, metalness: 0.65 }),
    red: new THREE.MeshStandardMaterial({ color: 0x8f1f18, emissive: 0xff3b2f, emissiveIntensity: 1.5, roughness: 0.4 }),
    blue: new THREE.MeshStandardMaterial({ color: 0x123c58, emissive: 0x3fb6ff, emissiveIntensity: 1.4, roughness: 0.35 }),
    yellow: new THREE.MeshStandardMaterial({ color: 0x5c4a10, emissive: 0xffc93b, emissiveIntensity: 1.3, roughness: 0.4 }),
    core: new THREE.MeshStandardMaterial({ color: 0x0c2a1a, emissive: 0x54ffa8, emissiveIntensity: 2.2, roughness: 0.3 }),
    loot: new THREE.MeshStandardMaterial({ color: 0x2b3f52, emissive: 0x9fd6ff, emissiveIntensity: 0.7, roughness: 0.4, metalness: 0.5 }),
  };

  const mechRoot = new THREE.Group();
  scene.add(mechRoot);

  function tagPart(mesh, part) {
    mesh.userData.partId = part.id;
    mesh.castShadow = !REDUCE;
    mesh.receiveShadow = true;
    return mesh;
  }

  function addPart(list, spec, geo, mat, pos, rot) {
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos[0], pos[1], pos[2]);
    if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
    list.push({ spec, mesh });
    return mesh;
  }

  /**
   * 依機甲類型產生部件。座標：地面 y=0，機甲面向 +Z（玩家從 +Z 側接近）。
   * types: armor / strut / line-red / line-blue / line-bus / loot / core
   */
  function buildBlueprint(kind) {
    const out = [];
    const scale = kind === 'fortress' ? 1.35 : kind === 'quad' ? 1.15 : kind === 'scrap' ? 0.95 : 1.0;
    const S = (v) => v * scale;

    // 底盤 / 骨盆
    addPart(out, { id: 'frame', type: 'frame', label: '主結構', value: 0, need: 99 }, new THREE.BoxGeometry(S(3.2), S(1.2), S(2.4)), MAT.frame, [0, S(1.2), 0]);

    // 腿 / 承重柱（struts）
    const legX = S(1.5);
    for (const [i, sx] of [-1, 1].entries()) {
      addPart(out, { id: `strut-leg-${i}`, type: 'strut', label: `腿部承重柱 ${i + 1}`, value: 22000, need: 2.4 }, new THREE.BoxGeometry(S(0.82), S(4.2), S(0.82)), MAT.strut, [sx * legX, S(3.2), 0]);
    }
    // 手臂承重柱
    for (const [i, sx] of [-1, 1].entries()) {
      addPart(out, { id: `strut-arm-${i}`, type: 'strut', label: `手臂承重連桿 ${i + 1}`, value: 18000, need: 2.0 }, new THREE.BoxGeometry(S(0.6), S(2.8), S(0.6)), MAT.strut, [sx * S(2.3), S(6.4), 0]);
    }

    // 軀幹
    addPart(out, { id: 'torso', type: 'frame', label: '軀幹骨架', value: 0, need: 99 }, new THREE.BoxGeometry(S(3.4), S(3.0), S(2.2)), MAT.frame, [0, S(6.4), 0]);

    // 胸甲（兩片，需切開才能看到核心）
    addPart(out, { id: 'armor-chest-l', type: 'armor', label: '左胸複合裝甲', value: 42000, need: 3.0 }, new THREE.BoxGeometry(S(1.7), S(2.4), S(0.42)), MAT.armor, [-S(0.88), S(6.5), S(1.12)]);
    addPart(out, { id: 'armor-chest-r', type: 'armor', label: '右胸複合裝甲', value: 42000, need: 3.0 }, new THREE.BoxGeometry(S(1.7), S(2.4), S(0.42)), MAT.armor, [S(0.88), S(6.5), S(1.12)]);

    // 肩甲
    for (const [i, sx] of [-1, 1].entries()) {
      addPart(out, { id: `armor-shoulder-${i}`, type: 'armor', label: `肩部裝甲 ${i + 1}`, value: 30000, need: 2.6 }, new THREE.BoxGeometry(S(1.4), S(1.1), S(1.8)), MAT.armorHot, [sx * S(2.3), S(7.2), 0]);
    }

    // 頭部裝甲
    addPart(out, { id: 'armor-head', type: 'armor', label: '頭部感測艙', value: 26000, need: 2.2 }, new THREE.BoxGeometry(S(1.2), S(0.9), S(1.2)), MAT.armor, [0, S(8.3), 0]);

    // 管線（紅／藍／黃）
    addPart(out, { id: 'line-red', type: 'line-red', label: '紅色高壓液壓管', value: 0, need: 1.2 }, new THREE.CylinderGeometry(S(0.16), S(0.16), S(4.6), 8), MAT.red, [-S(1.05), S(5.0), S(0.75)], [0, 0, 0.12]);
    addPart(out, { id: 'line-blue', type: 'line-blue', label: '藍色低溫冷卻管', value: 0, need: 1.2 }, new THREE.CylinderGeometry(S(0.15), S(0.15), S(4.4), 8), MAT.blue, [S(1.05), S(5.0), S(0.75)], [0, 0, -0.12]);
    addPart(out, { id: 'line-bus', type: 'line-bus', label: '黃色主動力母線', value: 0, need: 1.4 }, new THREE.CylinderGeometry(S(0.14), S(0.14), S(4.0), 8), MAT.yellow, [0, S(5.2), -S(0.68)]);

    // 高價值模組（黑市要的東西）
    addPart(out, { id: 'loot-neural', type: 'loot', label: '神經控制晶片', value: 95000, need: 1.6 }, new THREE.BoxGeometry(S(0.5), S(0.4), S(0.5)), MAT.loot, [S(0.85), S(7.6), -S(0.6)]);
    addPart(out, { id: 'loot-coating', type: 'loot', label: '隱形塗層模組', value: 72000, need: 1.6 }, new THREE.BoxGeometry(S(0.7), S(0.5), S(0.7)), MAT.loot, [-S(0.9), S(7.4), -S(0.62)]);

    // 核心（被胸甲遮住；拆開胸甲後才可取出）
    addPart(out, { id: 'core', type: 'core', label: '聚變動力核心', value: 160000, need: 99 }, new THREE.SphereGeometry(S(0.55), 20, 16), MAT.core, [0, S(6.5), 0]);

    // 依機甲種類加料
    if (kind === 'quad') {
      for (const [i, sx] of [-1, 1].entries()) {
        addPart(out, { id: `armor-hind-${i}`, type: 'armor', label: `後側推進裝甲 ${i + 1}`, value: 34000, need: 2.8 }, new THREE.BoxGeometry(S(2.0), S(1.8), S(0.4)), MAT.armorHot, [sx * S(1.4), S(5.6), -S(1.15)]);
      }
    } else if (kind === 'fortress') {
      addPart(out, { id: 'armor-plate-extra', type: 'armor', label: '軌道砲防護板', value: 58000, need: 3.4 }, new THREE.BoxGeometry(S(3.0), S(1.6), S(0.5)), MAT.armor, [0, S(8.7), S(1.0)]);
    } else if (kind === 'scrap') {
      addPart(out, { id: 'loot-trap', type: 'loot', label: '未擊發彈藥束', value: 60000, need: 1.4 }, new THREE.BoxGeometry(S(0.8), S(0.6), S(0.5)), MAT.loot, [0, S(4.2), S(1.0)]);
    }
    return out;
  }

  const tetherLines = [];
  const falling = [];

  function buildSite(contract) {
    // 清空（含上一單殘留的火焰、傾倒姿態）
    for (const p of state.parts) mechRoot.remove(p.mesh);
    for (const f of state.fires) scene.remove(f.mesh);
    state.fires = [];
    mechRoot.rotation.set(0, 0, 0);
    mechRoot.position.set(0, 0, 0);
    state.parts = [];
    for (const t of tetherLines) scene.remove(t.line);
    tetherLines.length = 0;
    for (const f of falling) scene.remove(f.mesh);
    falling.length = 0;

    const blueprint = buildBlueprint(contract.mech);
    for (const item of blueprint) {
      const part = {
        ...item.spec,
        mesh: item.mesh,
        cut: 0,
        cutNeed: item.spec.need,
        state: 'intact',       // intact | cutting | loose | salvaged | removed
        tethered: false,
        value: item.spec.value || 0,
      };
      tagPart(item.mesh, part);
      mechRoot.add(item.mesh);
      state.parts.push(part);
    }

    // 標記：核心初始隱藏（在胸甲後）
    const core = state.parts.find((p) => p.id === 'core');
    if (core) core.mesh.visible = true;

    // 地標（簡化：看板 + 結構）
    buildLandmark(contract.landmark);
  }

  let landmarkGroup = null;
  function buildLandmark(name) {
    if (landmarkGroup) { scene.remove(landmarkGroup); landmarkGroup = null; }
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x27313d, roughness: 0.8, metalness: 0.3 });
    if (name === '捷運軌道') {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(60, 0.6, 3.4), mat);
      rail.position.set(0, 6.5, -16); g.add(rail);
      for (let i = -3; i <= 3; i++) {
        const pylon = new THREE.Mesh(new THREE.BoxGeometry(1.2, 6.4, 1.2), mat);
        pylon.position.set(i * 9, 3.2, -16); g.add(pylon);
      }
    } else if (name === '行人天橋') {
      const bridge = new THREE.Mesh(new THREE.BoxGeometry(34, 2.2, 3), mat);
      bridge.position.set(-2, 8, 12); g.add(bridge);
      for (const sx of [-14, 12]) {
        const col = new THREE.Mesh(new THREE.BoxGeometry(1.4, 8, 1.4), mat);
        col.position.set(sx, 4, 12); g.add(col);
      }
    } else if (name === '101 基座') {
      for (let i = 0; i < 3; i++) {
        const slab = new THREE.Mesh(new THREE.BoxGeometry(26 - i * 4, 1.6, 26 - i * 4), mat);
        slab.position.set(0, 1 + i * 1.6, -22); g.add(slab);
      }
    } else {
      const shed = new THREE.Mesh(new THREE.BoxGeometry(30, 7, 18), new THREE.MeshStandardMaterial({ color: 0x3a2f25, roughness: 0.95 }));
      shed.position.set(0, 3.5, -20); g.add(shed);
    }
    landmarkGroup = g;
    scene.add(g);
  }

  /* ================================================================== *
   * 6. 玩家（第一人稱）
   * ================================================================== */
  const player = {
    pos: new THREE.Vector3(0, 0, 16),
    vel: new THREE.Vector3(),
    yaw: 0,
    pitch: -0.05,
    onGround: true,
    fuel: CONFIG.jetFuel,
  };
  const keys = Object.create(null);
  const stick = { x: 0, y: 0, active: false, id: null };
  const STICK_R = 48;

  const toolNames = ['cutter', 'tether', 'gel', 'scan'];
  const tools = { current: 'cutter' };

  function setTool(name) {
    if (!toolNames.includes(name)) return;
    tools.current = name;
    document.querySelectorAll('.tool').forEach((b) => b.classList.toggle('on', b.dataset.tool === name));
    updatePrompt();
  }

  document.querySelectorAll('.tool').forEach((btn) => {
    btn.addEventListener('click', () => setTool(btn.dataset.tool));
  });

  /* ================================================================== *
   * 7. 互動
   * ================================================================== */
  const raycaster = new THREE.Raycaster();
  raycaster.far = CONFIG.interactRange;
  const tmpV = new THREE.Vector3();

  function cameraDir(out = new THREE.Vector3()) {
    return camera.getWorldDirection(out);
  }

  function pickPart() {
    raycaster.setFromCamera({ x: 0, y: 0 }, camera);
    raycaster.far = CONFIG.interactRange;
    const live = state.parts.filter((p) => p.state !== 'salvaged' && p.state !== 'removed');
    const hits = raycaster.intersectObjects(live.map((p) => p.mesh), false);
    if (hits.length) {
      const part = state.parts.find((p) => p.mesh === hits[0].object);
      if (part) return { part, point: hits[0].point, dist: hits[0].distance };
    }
    // 輔助瞄準：機甲部件很小、玩家拿的是工具不是狙擊槍，
    // 準心只要在 22° 內、距離最近就給選，避免「明明對著卻沒反應」。
    const dir = camera.getWorldDirection(new THREE.Vector3());
    let best = null;
    for (const part of live) {
      const wp = new THREE.Vector3();
      part.mesh.getWorldPosition(wp);
      const to = wp.clone().sub(camera.position);
      const dist = to.length();
      if (dist > CONFIG.interactRange) continue;
      const cos = to.normalize().dot(dir);
      if (cos > 0.92 && (!best || dist < best.dist)) best = { part, point: wp, dist };
    }
    return best;
  }

  function pickValve() {
    const valve = valveMesh;
    if (!valve) return null;
    raycaster.setFromCamera({ x: 0, y: 0 }, camera);
    raycaster.far = CONFIG.interactRange;
    const hits = raycaster.intersectObject(valve, false);
    return hits.length ? hits[0] : null;
  }

  let valveMesh = null;
  function spawnValve(scale) {
    if (valveMesh) { scene.remove(valveMesh); valveMesh = null; }
    const geo = new THREE.TorusGeometry(0.42 * scale, 0.12 * scale, 10, 18);
    valveMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x8a939c, emissive: 0x36d0a0, emissiveIntensity: 1.2, metalness: 0.8, roughness: 0.3 }));
    valveMesh.position.set(1.9 * scale, 2.4 * scale, 1.5 * scale);
    valveMesh.rotation.x = Math.PI / 2;
    scene.add(valveMesh);
  }

  /* ---- 進度 / 切割 ---- */
  let cutting = null;   // {part, t}
  let scanHold = false;

  function toolSpeed() {
    return CONFIG.cutterRate * (1 + state.upgrades.cutter * 0.3);
  }

  function resolveCut(part) {
    switch (part.type) {
      case 'armor': {
        detach(part, '裝甲切除');
        break;
      }
      case 'line-red': {
        if (!state.depressurized) {
          explode(part, '液壓管未洩壓，高壓油遇熱引爆');
        } else {
          part.state = 'removed'; part.mesh.visible = false;
          log('紅色液壓管已洩壓後切除', 'good');
        }
        break;
      }
      case 'line-blue': {
        part.state = 'removed'; part.mesh.visible = false;
        player.fuel = Math.max(0, player.fuel - 0.8);
        log('冷卻劑外洩：局部凍結，噴射燃料 -0.8s', 'warn');
        break;
      }
      case 'line-bus': {
        part.state = 'removed'; part.mesh.visible = false;
        for (const l of baseLights) l.intensity = l.base * 0.25;
        log('主動力母線切斷：照明失效，核心計時照走', 'warn');
        break;
      }
      case 'strut': {
        cutStrut(part);
        break;
      }
      case 'loot': {
        detach(part, '高價值模組取出');
        break;
      }
      default:
        break;
    }
  }

  function detach(part, why) {
    part.state = 'loose';
    part.mesh.userData.loose = true;
    falling.push({ mesh: part.mesh, vy: 0, floor: 0.6, rest: false });
    log(`${why}：${part.label}`, 'good');
    sfx.done();
    // 已先繫留的部件，切下後自動吊回回收區
    if (part.tethered) {
      const dur = CONFIG.tetherTime * (1 - state.upgrades.tether * 0.2);
      setTimeout(() => salvage(part), dur * 1000);
    }
    // 胸甲拆掉 → 核心露出
    if (part.id.startsWith('armor-chest')) {
      const l = state.parts.find((p) => p.id === 'armor-chest-l');
      const r = state.parts.find((p) => p.id === 'armor-chest-r');
      if (l.state !== 'intact' && r.state !== 'intact' && !state.coreExposed) exposeCore();
    }
    if (part.type === 'loot') {
      // 直接可回收（黑市要完整模組）
      part.state = 'loose';
    }
  }

  function exposeCore() {
    state.coreExposed = true;
    state.coreLeft = CONFIG.coreTimer;
    dom.coretimer.classList.add('on');
    log('核心暴露！聚變反應爐開始升溫，60 秒內取出', 'bad');
    sfx.alarm();
  }

  function cutStrut(part) {
    if (!part.tethered) {
      topple(`承重柱 ${part.label} 未繫留即切斷`);
    }
    part.state = 'removed';
    part.mesh.visible = false;
    if (part.tethered) {
      part.state = 'loose';
      salvage(part);
      log(`${part.label} 已繫留切斷，安全回收`, 'good');
    }
  }

  function topple(reason) {
    if (state.toppled) return;
    state.toppled = true;
    state.penalties.push({ label: `地標損毀：${state.contract.landmark}（${reason}）`, amount: Math.round(state.contract.pay * 0.35) });
    log(`機甲傾倒，砸中 ${state.contract.landmark}！`, 'bad');
    sfx.boom();
    if (!REDUCE) shake(1.1);
    mechRoot.rotation.z = REDUCE ? 0.4 : 1.15;
    mechRoot.position.y = -2.2;
  }

  function explode(part, reason) {
    part.state = 'removed';
    part.mesh.visible = false;
    const dmg = state.upgrades.suit ? 1 : 2;
    state.penalties.push({ label: `工安事故：${reason}`, amount: 40000 * dmg });
    log(`爆炸！${reason}`, 'bad');
    sfx.boom();
    dom.flash.classList.remove('on'); void dom.flash.offsetWidth; dom.flash.classList.add('on');
    if (!REDUCE) shake(1.6);
    player.vel.add(new THREE.Vector3(0, 6 * dmg, 0));
    // 起火
    spawnFire(part.mesh.position.clone());
    if (!state.depressurized && state.contract.hazard.includes('液壓')) {
      state.penalties.push({ label: '合約違約：未執行洩壓程序', amount: 25000 });
    }
  }

  function spawnFire(pos) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff7a33, transparent: true, opacity: 0.85 }),
    );
    m.position.copy(pos); m.position.y = Math.max(0.4, m.position.y);
    scene.add(m);
    state.fires.push({ mesh: m, life: 14 });
  }

  function salvage(part) {
    if (part.state === 'salvaged') return;
    part.state = 'salvaged';
    state.salvaged += 1;
    const v = part.value || 0;
    state.earned += v;
    dom.credits.textContent = fmt(state.earned);
    updateQuota();
    log(`回收 ${part.label} +${fmt(v)}`, 'good');
    part.mesh.visible = false;
  }

  function tetherPart(part) {
    if (part.tethered) return;
    part.tethered = true;
    const mat = new THREE.LineBasicMaterial({ color: 0x6fd0ff, transparent: true, opacity: 0.9 });
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    tetherLines.push({ line, part, t: 0 });
    log(`繫留 ${part.label}`, 'good');
    sfx.done();
    if (part.state === 'loose') {
      const dur = CONFIG.tetherTime * (1 - state.upgrades.tether * 0.2);
      setTimeout(() => salvage(part), dur * 1000);
    }
  }

  function useTool() {
    const hit = pickPart();
    if (!hit) return;
    const part = hit.part;

    if (tools.current === 'tether') { tetherPart(part); return; }
    if (tools.current === 'gel') {
      const fire = state.fires.find((f) => f.mesh.position.distanceTo(hit.point) < 3.2);
      if (fire) { scene.remove(fire.mesh); state.fires.splice(state.fires.indexOf(fire), 1); log('火勢撲滅', 'good'); }
      return;
    }
    if (tools.current === 'scan') { return; }
    // cutter
    if (part.type === 'core' || part.type === 'frame') { log('這個部位不能直接切割', 'warn'); return; }
    if (part.type === 'strut' && !part.tethered && !state.toppled) {
      // 允許切，但會倒；提示一次
    }
  }

  function actionE() {
    // 洩壓閥 / 核心 / 收工
    if (valveMesh && !state.depressurized && valveMesh.position.distanceTo(player.pos) < 4.6) {
      state.depressurized = true;
      valveMesh.material.color.set(0x3a4450);
      valveMesh.material.emissiveIntensity = 0.2;
      log('液壓系統洩壓完成，紅色管線可安全切除', 'good');
      sfx.done();
      updateObjective();
      return;
    }
    if (state.coreExposed && !state.coreTaken) {
      const core = state.parts.find((p) => p.id === 'core');
      if (core && core.mesh.position.distanceTo(player.pos) < 7.2 && player.pos.y > 2.5) {
        state.coreTaken = true;
        core.state = 'salvaged';
        core.mesh.visible = false;
        state.earned += core.value;
        state.salvaged += 1;
        dom.credits.textContent = fmt(state.earned);
        dom.coretimer.classList.remove('on');
        log(`核心已取出 +${fmt(core.value)}`, 'good');
        sfx.done();
        updateQuota(); updateObjective();
        return;
      }
    }
    if (state.quotaMet && state.coreTaken) { finish('manual'); return; }
    log('附近沒有可執行的操作（洩壓閥／核心／收工）', 'warn');
  }

  /* ================================================================== *
   * 8. HUD
   * ================================================================== */
  const fmt = (n) => new Intl.NumberFormat('en-US').format(Math.round(n));

  function log(text, kind = '') {
    const el = document.createElement('div');
    el.className = `l ${kind}`;
    el.textContent = text;
    dom.log.appendChild(el);
    setTimeout(() => el.remove(), 3600);
    while (dom.log.children.length > 4) dom.log.firstElementChild.remove();
  }

  function updateQuota() {
    const q = state.contract ? state.contract.quota : 0;
    dom.quota.textContent = `${state.salvaged} / ${q}`;
    dom.bar.style.width = `${Math.min(100, (state.salvaged / Math.max(1, q)) * 100)}%`;
    state.quotaMet = state.salvaged >= q;
  }

  function updateObjective() {
    const items = [
      { k: 'depressurized', text: '洩壓：紅色液壓管' },
      { k: 'armor', text: '拆除胸甲 ×2（露出核心）' },
      { k: 'core', text: '取出聚變核心' },
      { k: 'quota', text: `回收配額 ${state.contract ? state.contract.quota : 0} 件` },
    ];
    const chest = state.parts.filter((p) => p.id.startsWith('armor-chest') && p.state !== 'intact').length;
    const done = {
      depressurized: state.depressurized,
      armor: chest >= 2,
      core: state.coreTaken,
      quota: state.quotaMet,
    };
    dom.objList.innerHTML = items.map((i) => `<li class="${done[i.k] ? 'done' : ''}">${i.text}</li>`).join('');
  }

  function updatePrompt() {
    const hit = pickPart();
    dom.crosshair.classList.toggle('hit', !!hit);
    if (!hit) {
      const v = pickValve();
      if (v && !state.depressurized) {
        dom.prompt.classList.add('on');
        dom.prompt.innerHTML = '<b>E</b> 開啟洩壓閥';
      } else {
        dom.prompt.classList.remove('on');
      }
      return;
    }
    const p = hit.part;
    let txt = '';
    if (tools.current === 'tether') txt = p.tethered ? '已繫留' : `<b>左鍵</b> 繫留 ${p.label}`;
    else if (tools.current === 'cutter') {
      txt = p.type === 'core' ? '核心不可切割，靠近按 <b>E</b> 取出' : `<b>按住左鍵</b> 切割 ${p.label}`;
    } else if (tools.current === 'gel') txt = '<b>左鍵</b> 撲滅火源';
    else txt = '聲納模式：管線與應力節點已標示';
    dom.prompt.innerHTML = txt;
    dom.prompt.classList.add('on');
  }

  function updateAlerts() {
    const a = [];
    if (!state.depressurized) a.push('<div class="a">⚠ 液壓未洩壓 — 切紅色管線會引爆</div>');
    if (state.coreExposed && !state.coreTaken) a.push(`<div class="a">☢ 核心熔毀倒數 ${Math.ceil(state.coreLeft)}s</div>`);
    if (state.toppled) a.push('<div class="a">✖ 機甲已傾倒，地標受損</div>');
    if (!a.length) a.push('<div class="c">✔ 現場穩定</div>');
    dom.alerts.innerHTML = a.join('');
  }

  /* ================================================================== *
   * 9. 相機 / 移動
   * ================================================================== */
  let shakeAmp = 0;
  function shake(a) { shakeAmp = Math.max(shakeAmp, a); }

  function updateCamera(dt) {
    camera.position.set(player.pos.x, player.pos.y + CONFIG.eye, player.pos.z);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
    if (shakeAmp > 0.001 && !REDUCE) {
      camera.position.x += (Math.random() - 0.5) * shakeAmp * 0.25;
      camera.position.y += (Math.random() - 0.5) * shakeAmp * 0.25;
      shakeAmp *= Math.pow(0.02, dt);
    } else shakeAmp = 0;
  }

  function updatePlayer(dt) {
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stick.x;
    let iz = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) + stick.y;
    const mag = Math.hypot(ix, iz);
    if (mag > 1) { ix /= mag; iz /= mag; }
    const speed = (keys.ShiftLeft || keys.ShiftRight) ? CONFIG.run : CONFIG.walk;
    const wish = new THREE.Vector3(
      (-sin * iz + cos * ix) * speed * Math.min(1, mag),
      0,
      (-cos * iz - sin * ix) * speed * Math.min(1, mag),
    );
    player.vel.x += (wish.x - player.vel.x) * Math.min(1, 12 * dt);
    player.vel.z += (wish.z - player.vel.z) * Math.min(1, 12 * dt);

    // 噴射
    if (keys.Space && player.fuel > 0) {
      player.vel.y += CONFIG.jetPush * dt * 3.2;
      player.fuel = Math.max(0, player.fuel - dt);
    } else {
      player.vel.y -= 22 * dt;
    }
    if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.onGround = true; player.fuel = Math.min(CONFIG.jetFuel + state.upgrades.suit, player.fuel + dt * 0.8); }
    else player.onGround = false;

    player.pos.addScaledVector(player.vel, dt);

    // 機甲碰撞（簡化：距中心軸太近就推開）
    const core = new THREE.Vector3(0, 0, 0);
    const dx = player.pos.x - core.x, dz = player.pos.z - core.z;
    const r = 2.4;
    const d = Math.hypot(dx, dz);
    if (d < r && player.pos.y < 9) {
      const push = (r - d) / (d || 1);
      player.pos.x += dx * push; player.pos.z += dz * push;
    }
    player.pos.x = Math.max(-30, Math.min(30, player.pos.x));
    player.pos.z = Math.max(-26, Math.min(30, player.pos.z));
    if (player.pos.y > 16) player.pos.y = 16;
  }

  /* ================================================================== *
   * 10. 每幀：切割 / 火焰 / 繫留 / 核心
   * ================================================================== */
  let cutSoundT = 0;

  function updateCutting(dt) {
    if (cutting) {
      const hit = pickPart();
      if (!hit || hit.part !== cutting.part) { cutting = null; dom.cutbar.classList.remove('on'); return; }
      if (tools.current !== 'cutter') { cutting = null; dom.cutbar.classList.remove('on'); return; }
      cutting.part.cut += dt * toolSpeed();
      dom.cutbar.classList.add('on');
      dom.cutbarFill.style.width = `${Math.min(100, (cutting.part.cut / cutting.part.cutNeed) * 100)}%`;
      cutSoundT -= dt;
      if (cutSoundT <= 0) { sfx.cut(); cutSoundT = 0.1; }
      if (cutting.part.cut >= cutting.part.cutNeed) {
        const p = cutting.part;
        cutting = null;
        dom.cutbar.classList.remove('on');
        resolveCut(p);
        updateObjective();
      }
    } else {
      dom.cutbar.classList.remove('on');
    }
  }

  function updateFires(dt) {
    for (let i = state.fires.length - 1; i >= 0; i--) {
      const f = state.fires[i];
      f.life -= dt;
      f.mesh.scale.setScalar(1 + Math.sin(performance.now() / 140) * 0.12 + (14 - f.life) * 0.04);
      if (f.life <= 0) { scene.remove(f.mesh); state.fires.splice(i, 1); }
    }
  }

  function updateTether(dt) {
    for (let i = tetherLines.length - 1; i >= 0; i--) {
      const t = tetherLines[i];
      const pos = t.line.geometry.attributes.position;
      pos.setXYZ(0, player.pos.x, player.pos.y + 1.4, player.pos.z);
      const wp = new THREE.Vector3();
      t.part.mesh.getWorldPosition(wp);
      pos.setXYZ(1, wp.x, wp.y, wp.z);
      pos.needsUpdate = true;
      if (t.part.state === 'salvaged') { scene.remove(t.line); tetherLines.splice(i, 1); }
    }
  }

  function updateFalling(dt) {
    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i];
      if (f.rest) continue;
      f.vy -= 18 * dt;
      f.mesh.position.y = Math.max(f.floor, f.mesh.position.y + f.vy * dt);
      if (f.mesh.position.y <= f.floor) { f.rest = true; }
    }
  }

  function updateCore(dt) {
    if (!state.coreExposed || state.coreTaken) return;
    state.coreLeft -= dt;
    dom.coretimer.textContent = `CORE MELTDOWN ${Math.max(0, Math.ceil(state.coreLeft))}`;
    if (Math.floor(state.coreLeft) !== Math.floor(state.coreLeft + dt)) sfx.alarm();
    if (state.coreLeft <= 0 && !state.meltdown) {
      state.meltdown = true;
      explode(state.parts.find((p) => p.id === 'core') || state.parts[0], '反應爐熔毀');
      finish('meltdown');
    }
  }

  /* ================================================================== *
   * 11. 流程
   * ================================================================== */
  function renderMenu() {
    dom.contracts.innerHTML = CONTRACTS.map((c, i) => `
      <button class="contract" data-id="${c.id}">
        <div class="tagline ${c.kind === '黑市' ? 'black' : ''}">${c.kind === '黑市' ? 'BLACK MARKET' : 'CITY CONTRACT'}</div>
        <strong>${c.title}</strong>
        <small>${c.site}<br>${c.hazard}</small>
        <div class="pay">酬勞 ${fmt(c.pay)} · 配額 ${c.quota} 件</div>
      </button>`).join('');
    dom.contracts.querySelectorAll('.contract').forEach((b) => {
      b.addEventListener('click', () => startContract(b.dataset.id));
    });
    dom.wallet.textContent = fmt(state.credits);
  }

  function startContract(id) {
    const c = CONTRACTS.find((x) => x.id === id);
    if (!c) return;
    state.contract = c;
    state.screen = 'site';
    state.salvaged = 0; state.earned = 0; state.penalties = [];
    state.quotaMet = false; state.depressurized = false;
    state.coreExposed = false; state.coreTaken = false;
    state.coreLeft = CONFIG.coreTimer; state.meltdown = false;
    state.toppled = false; state.finished = false;
    state.fires = [];
    state.startedAt = performance.now();
    state.elapsed = 0;
    player.pos.set(0, 0, 16); player.vel.set(0, 0, 0);
    player.yaw = 0; player.pitch = -0.02; player.fuel = CONFIG.jetFuel + state.upgrades.suit;

    dom.menu.classList.remove('on');
    dom.debrief.classList.remove('on');
    dom.hud.classList.add('on');
    dom.objName.textContent = c.title;
    dom.coretimer.classList.remove('on');
    dom.credits.textContent = '0';
    dom.log.innerHTML = '';

    for (const l of baseLights) l.intensity = l.base;
    buildSite(c);
    spawnValve(c.mech === 'fortress' ? 1.35 : 1);
    setTool('cutter');
    updateQuota(); updateObjective(); updateAlerts();
    sfx.resume();
    if (!IS_COARSE) dom.look.requestPointerLock?.();
    state.screen = 'site';
  }

  function finish(reason) {
    if (state.finished) return;
    state.finished = true;
    state.elapsed = (performance.now() - state.startedAt) / 1000;
    const c = state.contract;
    const base = state.earned;
    const penalty = state.penalties.reduce((a, p) => a + p.amount, 0);
    const quotaBonus = state.quotaMet ? Math.round(c.pay * 0.4) : 0;
    const total = Math.max(0, base + quotaBonus - penalty);

    state.credits += total;
    state.screen = 'debrief';
    if (document.pointerLockElement) document.exitPointerLock();

    dom.hud.classList.remove('on');
    dom.debrief.classList.add('on');
    dom.dbTitle.textContent = reason === 'meltdown' ? '反應爐熔毀 — 現場封鎖' : state.quotaMet && state.coreTaken ? '拆除完成' : '提前收工';
    dom.dbSub.textContent = `${c.title} · ${c.site} · 用時 ${Math.round(state.elapsed)} 秒`;
    if (reason !== 'meltdown') sfx.win();

    const rows = [
      ['回收零件價值', fmt(base), ''],
      [`履約獎金（配額 ${c.quota} 件）`, state.quotaMet ? '+' + fmt(quotaBonus) : '未達標', state.quotaMet ? '' : 'minus'],
      ...state.penalties.map((p) => [p.label, '-' + fmt(p.amount), 'minus']),
      ['本次入帳', fmt(total), 'total'],
    ];
    dom.ledger.innerHTML = rows.map(([l, v, cls]) => `<div class="r ${cls}"><span>${l}</span><b>${v}</b></div>`).join('');

    renderUpgrades();
    dom.wallet.textContent = fmt(state.credits);
  }

  function renderUpgrades() {
    dom.upgrades.innerHTML = UPGRADES.map((u) => {
      const lvl = state.upgrades[u.id] || 0;
      const cost = Math.round(u.base * Math.pow(1.6, lvl));
      const can = state.credits >= cost && lvl < 3;
      return `<button class="up" data-id="${u.id}" ${can ? '' : 'disabled'}>
        <b>${u.name} <small>Lv.${lvl}</small></b>
        <small>${u.desc}</small>
        <span class="cost">${lvl >= 3 ? '已滿級' : can ? '升級 ' + fmt(cost) + ' 元' : '資金不足 · ' + fmt(cost)}</span>
      </button>`;
    }).join('');
    dom.upgrades.querySelectorAll('.up').forEach((b) => {
      b.addEventListener('click', () => {
        const u = UPGRADES.find((x) => x.id === b.dataset.id);
        const lvl = state.upgrades[u.id] || 0;
        const cost = Math.round(u.base * Math.pow(1.6, lvl));
        if (state.credits < cost || lvl >= 3) return;
        state.credits -= cost;
        state.upgrades[u.id] = lvl + 1;
        renderUpgrades();
        dom.wallet.textContent = fmt(state.credits);
        log('工具已升級', 'good');
      });
    });
  }

  dom.nextBtn.addEventListener('click', () => {
    dom.debrief.classList.remove('on');
    dom.menu.classList.add('on');
    renderMenu();
    state.screen = 'menu';
  });
  dom.againBtn.addEventListener('click', () => {
    const id = state.contract?.id;
    if (id) startContract(id);
  });

  /* ================================================================== *
   * 12. 輸入
   * ================================================================== */
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (state.screen !== 'site') return;
    if (e.code === 'Digit1') setTool('cutter');
    if (e.code === 'Digit2') setTool('tether');
    if (e.code === 'Digit3') setTool('gel');
    if (e.code === 'Digit4') setTool('scan');
    if (e.code === 'KeyE') actionE();
    if (e.code === 'Space') e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  document.addEventListener('pointerlockchange', () => {
    document.documentElement.classList.toggle('locked', document.pointerLockElement === dom.look);
  });

  document.addEventListener('mousemove', (e) => {
    if (state.screen !== 'site') return;
    if (document.pointerLockElement !== dom.look && !e.buttons) return;
    player.yaw -= e.movementX * 0.0022;
    player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - e.movementY * 0.0022));
  });

  /* ---- 滑鼠：點擊 = 工具動作；按住 = 切割 ---- */
  dom.look.addEventListener('pointerdown', (e) => {
    if (state.screen !== 'site') return;
    if (e.pointerType === 'mouse') {
      if (document.pointerLockElement !== dom.look) {
        if (e.button === 0) dom.look.requestPointerLock?.();
        return;
      }
      if (e.button !== 0) return;
      beginUse();
    } else {
      touchLook.id = e.pointerId; touchLook.x = e.clientX; touchLook.y = e.clientY; touchLook.moved = 0;
    }
  });

  window.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'mouse') { endUse(); return; }
    if (e.pointerId === touchLook.id) {
      const tapped = touchLook.moved < 16;
      touchLook.id = null;
      if (tapped && state.screen === 'site') beginUse();
      endUse();
    }
  });

  function beginUse() {
    if (tools.current === 'cutter') {
      const hit = pickPart();
      if (!hit) return;
      if (hit.part.type === 'core' || hit.part.type === 'frame') { useTool(); return; }
      cutting = { part: hit.part };
      hit.part.state = 'cutting';
    } else {
      useTool();
    }
  }
  function endUse() {
    if (cutting) {
      cutting.part.state = 'intact';
      cutting = null;
    }
    dom.cutbar.classList.remove('on');
  }

  /* ---- 手機 ---- */
  const touchLook = { id: null, x: 0, y: 0, moved: 0 };
  dom.look.addEventListener('pointermove', (e) => {
    if (e.pointerId !== touchLook.id || state.screen !== 'site') return;
    const dx = e.clientX - touchLook.x, dy = e.clientY - touchLook.y;
    touchLook.moved += Math.abs(dx) + Math.abs(dy);
    touchLook.x = e.clientX; touchLook.y = e.clientY;
    player.yaw -= dx * 0.0042;
    player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - dy * 0.0042));
  });

  function applyStick(e) {
    const r = dom.stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > STICK_R) { dx = (dx / len) * STICK_R; dy = (dy / len) * STICK_R; }
    dom.knob.style.transform = `translate(${dx}px, ${dy}px)`;
    stick.x = dx / STICK_R; stick.y = -dy / STICK_R; stick.active = true;
  }
  dom.stick.addEventListener('pointerdown', (e) => { stick.id = e.pointerId; applyStick(e); dom.stick.setPointerCapture(e.pointerId); });
  dom.stick.addEventListener('pointermove', (e) => { if (e.pointerId === stick.id) applyStick(e); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
    dom.stick.addEventListener(ev, (e) => {
      if (e.pointerId !== stick.id) return;
      stick.x = stick.y = 0; stick.active = false; stick.id = null;
      dom.knob.style.transform = '';
    });
  }
  dom.useBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); beginUse(); });
  dom.useBtn.addEventListener('pointerup', (e) => { e.preventDefault(); endUse(); });
  dom.actBtn.addEventListener('click', (e) => { e.preventDefault(); actionE(); });

  /* ================================================================== *
   * 13. 主迴圈
   * ================================================================== */
  const clock = new THREE.Clock();
  let frames = 0, fps = 0, fpsT = 0, totalFrames = 0;

  function animate() {
    const raw = Math.min(clock.getDelta(), 0.1);
    if (state.screen === 'site') {
      updatePlayer(raw);
      updateCutting(raw);
      updateFalling(raw);
      updateTether(raw);
      updateFires(raw);
      updateCore(raw);
      updateAlerts();
      updatePrompt();
      updateQuota();
    }
    updateCamera(raw);
    renderer.render(scene, camera);

    frames += 1; totalFrames += 1; fpsT += raw;
    if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ================================================================== *
   * 14. 啟動 + 測試接口
   * ================================================================== */
  renderMenu();
  animate();

  window.__v3 = {
    get state() {
      return {
        screen: state.screen, contract: state.contract?.id || null,
        salvaged: state.salvaged, earned: state.earned, credits: state.credits,
        quotaMet: state.quotaMet, depressurized: state.depressurized,
        coreExposed: state.coreExposed, coreTaken: state.coreTaken,
        coreLeft: Math.round(state.coreLeft), toppled: state.toppled,
        penalties: state.penalties.length, finished: state.finished,
        parts: state.parts.length, fps, frames: totalFrames,
        tool: tools.current,
      };
    },
    get parts() { return state.parts.map((p) => ({ id: p.id, type: p.type, state: p.state, cut: +p.cut.toFixed(2), need: p.cutNeed, tethered: p.tethered })); },
    get player() { return { x: player.pos.x, y: player.pos.y, z: player.pos.z, yaw: player.yaw }; },
    get contracts() { return CONTRACTS.map((c) => ({ id: c.id, title: c.title, quota: c.quota, pay: c.pay })); },
    startContract, setTool, actionE,
    beginUse, endUse,
    lookAt(x, y, z) {
      const dx = x - player.pos.x, dy = y - (player.pos.y + CONFIG.eye), dz = z - player.pos.z;
      player.yaw = Math.atan2(-dx, -dz);
      player.pitch = Math.atan2(dy, Math.hypot(dx, dz));
    },
    teleport(x, y, z) { player.pos.set(x, y, z); player.vel.set(0, 0, 0); updateCamera(0.016); },
    /** QA：把玩家送到部件前面並對準它 */
    facePart(id) {
      const p = state.parts.find((x) => x.id === id);
      if (!p) return null;
      const wp = new THREE.Vector3(); p.mesh.getWorldPosition(wp);
      const dir = new THREE.Vector3(wp.x, 0, wp.z);
      if (dir.lengthSq() < 0.01) dir.set(0, 0, 1);   // 核心在機甲中軸，改用 +Z 取位
      dir.normalize();
      const stand = new THREE.Vector3(wp.x + dir.x * 5.5, 0, wp.z + dir.z * 5.5);
      player.pos.copy(stand); player.vel.set(0, 0, 0);
      this.lookAt(wp.x, wp.y, wp.z);
      updateCamera(0.016);
      return { x: wp.x, y: wp.y, z: wp.z };
    },
    /** QA：直接切完某部件（不繞過切割規則，只跳過按住時間） */
    cutPart(id) {
      const p = state.parts.find((x) => x.id === id);
      if (!p) return false;
      this.facePart(id);
      setTool('cutter');
      beginUse();
      p.cut = p.cutNeed;
      // 下一幀由 updateCutting 判定完成；這裡直接呼叫結算以便同步測試
      resolveCut(p);
      endUse();
      updateObjective();
      return true;
    },
    finish,
    tetherPart(id) {
      const p = state.parts.find((x) => x.id === id);
      if (!p) return false;
      tetherPart(p);
      return true;
    },
    pressE: actionE,
    aim() { const h = pickPart(); return h ? { id: h.part.id, type: h.part.type, dist: Math.round(h.dist) } : null; },
  };
  </script>
</body>
</html>
